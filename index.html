<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0052D9">
<title>今日待办</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --brand: #0052D9;
    --brand-weak: #E8F0FE;
    --bg: #F4F6FA;
    --card: #FFFFFF;
    --text: #1A1C1F;
    --text-2: #6B7280;
    --line: #ECEFF4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px; line-height: 1.5; min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border-radius: 16px; box-shadow: 0 2px 12px rgba(16,24,40,.06); padding: 20px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  .sub { color: var(--text-2); font-size: 13px; margin-top: 4px; }
  .count { font-size: 13px; color: var(--brand); background: var(--brand-weak); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }

  .add { display: flex; gap: 10px; margin-top: 18px; }
  input[type="text"] {
    width: 100%; height: 46px; padding: 0 14px; font-size: 16px;
    color: var(--text); background: #F7F8FA; border: 1px solid var(--line);
    border-radius: 10px; outline: none; -webkit-appearance: none;
  }
  input:focus { border-color: var(--brand); background: #fff; }
  button { font-family: inherit; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; }
  .add input { flex: 1; min-width: 0; }
  .add button { flex: none; width: 76px; height: 46px; background: var(--brand); color: #fff; }
  .add button:active { background: #0043B3; }

  ul { list-style: none; margin: 16px 0 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-top: 1px solid var(--line); }
  li:first-child { border-top: none; }
  .check {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid #C6CDD8; background: #fff; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .check svg { display: none; width: 14px; height: 14px; }
  li.done .check { background: var(--brand); border-color: var(--brand); }
  li.done .check svg { display: block; }
  .title { flex: 1; min-width: 0; word-break: break-word; }
  li.done .title { color: #A6ADB9; text-decoration: line-through; }
  .del { flex: none; width: 32px; height: 32px; border-radius: 8px; background: none; color: #B6BCC7; font-size: 20px; line-height: 1; padding: 0; }
  .del:active { background: #FDECEA; color: #D93026; }
  .empty { text-align: center; color: var(--text-2); font-size: 14px; padding: 36px 0 12px; }
  .hint { color: var(--text-2); font-size: 13px; margin-top: 10px; min-height: 20px; }

  .status {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 18px; font-size: 12px; color: var(--text-2);
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #34C759; }
  .status.off .dot { background: #C6CDD8; }
  .status button { background: none; color: var(--brand); font-size: 12px; height: auto; padding: 0 4px; text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <div class="head">
      <div>
        <h1>今日待办</h1>
        <div id="today" class="sub"></div>
      </div>
      <div id="count" class="count">剩余 0 项</div>
    </div>

    <div class="add">
      <input id="input" type="text" maxlength="80" placeholder="添加一件要做的事">
      <button id="btnAdd" type="button">添加</button>
    </div>
    <div id="msg" class="hint"></div>

    <ul id="list"></ul>
    <div id="empty" class="empty">今天还没有待办，添加第一项吧</div>

    <div id="status" class="status">
      <span class="dot"></span><span id="statusText">正在连接…</span>
      <button id="btnRetry" type="button" hidden>重试</button>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://tlmuedzvqszbjtnpbxme.supabase.co";
  var SUPABASE_KEY = "sb_publishable_EO6e40Yo7mnCwRoovDfomA_PcnSsGMU";
  var STORE_KEY = "todo_today_v2";

  var $ = function (id) { return document.getElementById(id); };
  var inputEl = $("input"), listEl = $("list"), emptyEl = $("empty");
  var countEl = $("count"), msgEl = $("msg");
  var statusEl = $("status"), statusText = $("statusText"), btnRetry = $("btnRetry");

  var db = null;          // Supabase 客户端，null = 本地模式
  var todos = [];

  /* ---------- 日期与本地缓存 ---------- */

  function todayStr() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  function readStore() {
    try {
      var o = JSON.parse(localStorage.getItem(STORE_KEY));
      return (o && typeof o === "object") ? o : {};
    } catch (e) { return {}; }
  }

  function saveLocal() {
    try {
      var o = readStore();
      o[todayStr()] = todos;
      localStorage.setItem(STORE_KEY, JSON.stringify(o));
    } catch (e) { /* 存储不可用时静默降级 */ }
  }

  /* ---------- 渲染 ---------- */

  function remaining() {
    var n = 0;
    for (var i = 0; i < todos.length; i++) { if (!todos[i].done) n++; }
    return n;
  }

  function render() {
    listEl.innerHTML = "";
    countEl.textContent = "剩余 " + remaining() + " 项";
    emptyEl.hidden = todos.length > 0;

    todos.forEach(function (t) {
      var li = document.createElement("li");
      li.className = t.done ? "done" : "";

      var check = document.createElement("button");
      check.className = "check";
      check.type = "button";
      check.setAttribute("aria-label", t.done ? "标记为未完成" : "标记为已完成");
      check.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      check.onclick = function () { toggle(t); };

      var span = document.createElement("div");
      span.className = "title";
      span.textContent = t.title;

      var del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.setAttribute("aria-label", "删除");
      del.textContent = "×";
      del.onclick = function () { remove(t); };

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(del);
      listEl.appendChild(li);
    });
  }

  function setStatus(online, text) {
    statusEl.className = online ? "status" : "status off";
    statusText.textContent = text;
  }

  /* ---------- 云端 ---------- */

  async function initCloud() {
    setStatus(false, "正在连接…");
    btnRetry.hidden = true;

    if (typeof supabase === "undefined" || !supabase.createClient) {
      setStatus(false, "本地模式（云服务未加载）");
      btnRetry.hidden = false;
      return;
    }
    try {
      db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      var s = await db.auth.getSession();
      if (!s.data || !s.data.session) {
        var a = await db.auth.signInAnonymously();
        if (a.error) throw a.error;
      }

      var res = await db.from("todos")
        .select("id, title, done")
        .eq("day", todayStr())
        .order("created_at", { ascending: true })
        .limit(200);
      if (res.error) throw res.error;

      todos = (res.data || []).map(function (r) {
        return { id: r.id, title: r.title, done: r.done };
      });
      render();
      saveLocal();
      setStatus(true, "已同步到云端");
    } catch (e) {
      db = null;
      setStatus(false, "本地模式（云端未连接）");
      btnRetry.hidden = false;
    }
  }

  async function add() {
    var title = (inputEl.value || "").trim();
    if (!title) {                       // 空白任务不添加
      msgEl.textContent = "请输入内容后再添加";
      inputEl.focus();
      return;
    }
    msgEl.textContent = "";
    var t = { id: "local-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8), title: title, done: false };
    todos.push(t);
    inputEl.value = "";
    render();
    saveLocal();

    if (!db) return;
    var res = await db.from("todos").insert({ title: title, done: false, day: todayStr() }).select("id");
    if (res.error || !res.data || !res.data.length) {
      if (res.error) setStatus(false, "云端写入失败，已存本地");
      return;
    }
    var i = todos.indexOf(t);
    if (i > -1) todos[i] = { id: res.data[0].id, title: t.title, done: t.done };
    saveLocal();
  }

  async function toggle(t) {
    t.done = !t.done;
    render();
    saveLocal();
    if (!db || typeof t.id !== "number") return;
    var res = await db.from("todos").update({ done: t.done }).eq("id", t.id).select("id");
    if (res.error) setStatus(false, "云端更新失败，已存本地");
  }

  async function remove(t) {
    var i = todos.indexOf(t);
    if (i > -1) todos.splice(i, 1);
    render();
    saveLocal();
    msgEl.textContent = "";
    if (!db || typeof t.id !== "number") return;
    var res = await db.from("todos").delete().eq("id", t.id).select("id");
    if (res.error) setStatus(false, "云端删除失败，已存本地");
  }

  /* ---------- 启动 ---------- */

  $("btnAdd").onclick = add;
  btnRetry.onclick = initCloud;
  inputEl.onkeydown = function (e) { if (e.key === "Enter") add(); };

  var store = readStore();
  todos = Array.isArray(store[todayStr()]) ? store[todayStr()] : [];
  $("today").textContent = todayStr();
  render();
  initCloud();
})();
</script>
</body>
</html>
